[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
qwen3-asr = { workspace = true }
speakers = { workspace = true }

chrono = { workspace = true }
cpal = { workspace = true }
dirs = { workspace = true }
hound = { workspace = true }
lettre = { workspace = true }
pulldown-cmark = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "rt-multi-thread", "macros", "time"] }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
objc2 = { workspace = true }
objc2-core-audio = { workspace = true }
objc2-core-audio-types = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-foundation = { workspace = true }
security-framework = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
