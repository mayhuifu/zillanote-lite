[workspace]
resolver = "2"
members = ["crates/qwen3-asr", "crates/engine", "app"]

[workspace.dependencies]
qwen3-asr = { path = "crates/qwen3-asr" }
engine = { path = "crates/engine" }

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cpal = "0.17"
dirs = "6.0.0"
hound = "3.5.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots", "hostname"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
serde = "1"
serde_json = "1"
strum = "0.28"
sysinfo = "0.38"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"

tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }

# Debug builds are the dev loop: keep them small on disk. Line tables still give usable
# backtraces; full debug info is what made the old project's build folder tens of GB.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
