# Builds, tests and starts ZillaNote on a Windows machine, and keeps the installer.
# Runs on a push to the branch `windows-port`, on a version tag, or by hand.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [windows-port]
    tags: ["v*"]

permissions:
  contents: write # a version tag's installer is attached to its release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      # The TLS library behind the mailer ships assembly already built, so NASM is not needed.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Speech engine and ONNX Runtime
        run: |
          node scripts/fetch-llama-server.mjs
          node scripts/fetch-onnxruntime.mjs

      - name: Unit tests
        run: |
          $env:PATH = "$pwd\vendor\onnxruntime\lib;$env:PATH"
          cargo test --workspace --locked

      - name: Installer
        working-directory: app
        run: npx --yes @tauri-apps/cli@2.11.4 build

      - uses: actions/upload-artifact@v4
        with:
          name: ZillaNote-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: The built app starts, with its bar at the size it was drawn
        run: |
          Copy-Item vendor\onnxruntime\lib\DirectML.dll target\release\ -ErrorAction SilentlyContinue
          $data = Join-Path $env:RUNNER_TEMP "zillanote-data"
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:ZILLANOTE_DATA_DIR = $data
          $log = Join-Path $data "zillanote.log"
          $app = Start-Process -FilePath "target\release\zillanote.exe" -PassThru
          $ready = $false
          foreach ($second in 1..90) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and ((Select-String -Path $log -Pattern "ui_ready" | Measure-Object).Count -ge 2)) { $ready = $true; break }
            if ($app.HasExited) { break }
          }
          if (Test-Path $log) { Get-Content $log }
          if ($app.HasExited) { Write-Host "exit code $($app.ExitCode)" } else { Stop-Process -Id $app.Id -Force }
          if (-not $ready) { throw "The app did not report both of its pages ready." }
          # Windows has a smallest width of its own for a window, which once made the bar
          # several times as wide as on the Mac.
          $bar = Select-String -Path $log -Pattern "bar_size width=(\d+)(?:\.\d+)? height=(\d+)" | Select-Object -First 1
          if (-not $bar) { throw "The app did not say how big its bar is." }
          $width = [int]$bar.Matches[0].Groups[1].Value
          $height = [int]$bar.Matches[0].Groups[2].Value
          if ($width -ne 38 -or [math]::Abs($height - 142) -gt 2) { throw "The bar is $width by $height points, not 38 by 142." }

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = "target\release\bundle\nsis\ZillaNote_${version}_x64-setup.exe"
          gh release upload $env:GITHUB_REF_NAME $installer --clobber
          # The same file without the version in its name, for the links that always fetch the
          # latest release (README, website). Copied outside the bundle folder, which is cached.
          $latest = Join-Path $env:RUNNER_TEMP "ZillaNote_x64-setup.exe"
          Copy-Item $installer $latest
          gh release upload $env:GITHUB_REF_NAME $latest --clobber
